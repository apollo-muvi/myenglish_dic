<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="查詢英文單字、發音、例句、同義字與拼字相近的單字。">
  <title>My English Dictionary</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="brand">
      <a href="/" aria-label="My English Dictionary 首頁"><span class="brand-mark">M</span><span>My English Dictionary</span></a>
      <button id="saved-toggle" class="saved-toggle" type="button" aria-expanded="false" aria-controls="saved-panel">收藏 <span id="saved-count">0</span></button>
    </header>
    <section id="saved-panel" class="saved-panel" hidden aria-label="收藏的單字">
      <div class="saved-panel-heading"><strong>我的收藏</strong><button id="saved-close" class="text-button" type="button">收起</button></div>
      <div id="saved-words" class="word-chips"></div>
    </section>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">ENGLISH WORD LOOKUP</p>
      <h1 id="page-title">一個單字，<span>多一點理解</span></h1>
      <p class="intro">查意思、發音和自然例句，也看看哪些單字拼字相近。</p>
      <form id="lookup-form" class="search-form">
        <label class="sr-only" for="word-input">輸入英文單字或片語</label>
        <input id="word-input" name="word" type="search" maxlength="60" placeholder="輸入英文單字或片語" autocomplete="off" required>
        <button id="search-button" type="submit">查詢單字 <span aria-hidden="true">→</span></button>
        <div class="form-options">
          <label><input id="include-synonyms" type="checkbox"> 同時比較同義字</label>
          <label><input id="include-word-family" type="checkbox"> 查看同字根詞性</label>
        </div>
      </form>
      <p class="search-hint">例如：beautiful、thought、take care of</p>
      <div id="recent-words" class="recent-words" aria-label="最近查詢"></div>
    </section>
    <section id="status" class="status" aria-live="polite" hidden></section>
    <section id="result" class="results" aria-live="polite"></section>
    <footer>Dictionary · 拼字候選由 Datamuse 提供</footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
